spring:
  application:
    name: agente-ingles
  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5432/agente_ingles}
    username: ${BANCO_USUARIO:agente}
    password: ${BANCO_SENHA:agente}
  jpa:
    open-in-view: false
    hibernate:
      # O schema e controlado pelo Flyway; o Hibernate apenas valida se bate com as entidades.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    anthropic:
      # A chave nunca fica no repositorio: vem da variavel de ambiente ANTHROPIC_API_KEY.
      api-key: ${ANTHROPIC_API_KEY:}

agente-ingles:
  # Enquanto false, os agentes usam a implementacao simulada e nao consomem a API.
  usar-claude: ${USAR_CLAUDE:false}
  # Avaliador: a nota que sai daqui alimenta a media e a decisao do orquestrador.
  modelo-de-raciocinio: ${MODELO_DE_RACIOCINIO:claude-sonnet-5}
  # Gerador: separado para poder baixar so ele de nivel sem mexer na correcao.
  modelo-de-geracao: ${MODELO_DE_GERACAO:claude-sonnet-5}
  modelo-simples: claude-haiku-4-5
  # Desafios pedidos por chamada. O custo fixo do pedido e dividido por este numero.
  desafios-por-lote: ${DESAFIOS_POR_LOTE:5}
  # Lote da primeira visita a um modulo: quem nunca praticou ali pode nao voltar,
  # e o lote cheio deixaria quatro desafios ja pagos parados na fila.
  desafios-por-lote-inicial: ${DESAFIOS_POR_LOTE_INICIAL:2}
  # Dolar por milhao de tokens. Confira em anthropic.com/pricing: modelo sem preco
  # aqui tem os tokens gravados e o custo marcado como desconhecido, nunca como zero.
  precos-por-milhao-de-tokens:
    claude-sonnet-5:
      entrada: 3.00
      saida: 15.00
    claude-opus-5:
      entrada: 5.00
      saida: 25.00
    claude-haiku-4-5:
      entrada: 1.00
      saida: 5.00
  seguranca:
    tentativas-ate-bloquear: ${TENTATIVAS_ATE_BLOQUEAR:5}
    minutos-de-bloqueio: ${MINUTOS_DE_BLOQUEIO:15}
    tamanho-minimo-da-senha: 10
    minutos-de-sessao: ${MINUTOS_DE_SESSAO:60}
    origens-permitidas: ${ORIGENS_PERMITIDAS:http://localhost:5173,http://127.0.0.1:5173}

server:
  port: ${PORTA:8080}
  servlet:
    session:
      # Expira por inatividade: sessao eterna e credencial eterna.
      timeout: ${MINUTOS_DE_SESSAO:60}m
      cookie:
        # Fora do alcance de JavaScript: uma falha de XSS nao rouba a sessao.
        http-only: true
        # O navegador nao envia o cookie em requisicao vinda de outro site.
        same-site: strict
        # Em producao com HTTPS isto e obrigatorio. Falso no local porque
        # o navegador descarta cookie "secure" servido por http://localhost.
        secure: ${COOKIE_SEGURO:false}
        name: SESSAO

# Superficie minima: so a sonda de vida, e sem detalhe interno.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    br.com.agenteingles: DEBUG
