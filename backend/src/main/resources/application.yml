spring:
  application:
    name: agente-ingles
  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5432/agente_ingles}
    username: ${BANCO_USUARIO:agente}
    password: ${BANCO_SENHA:agente}
  jpa:
    open-in-view: false
    hibernate:
      # O schema e controlado pelo Flyway; o Hibernate apenas valida se bate com as entidades.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    anthropic:
      # A chave nunca fica no repositorio: vem da variavel de ambiente ANTHROPIC_API_KEY.
      api-key: ${ANTHROPIC_API_KEY:}

  # SMTP da recuperacao de senha. Vazio por padrao: o app sobe sem isto e o link vai
  # para o log, entao um clone recem-baixado funciona sem credencial de e-mail.
  #
  # Gmail: smtp.gmail.com na 587, usuario = seu e-mail, senha = SENHA DE APP de 16
  # caracteres (a senha normal da conta nao funciona; e preciso ter a verificacao em
  # duas etapas ligada para gerar uma).
  #
  # Trocar para Resend ou Brevo depois e mudar so estas quatro linhas — nenhum Java.
  mail:
    host: ${SMTP_SERVIDOR:}
    port: ${SMTP_PORTA:587}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_SENHA:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

agente-ingles:
  # Enquanto false, os agentes usam a implementacao simulada e nao consomem a API.
  usar-claude: ${USAR_CLAUDE:false}
  # Avaliador: a nota que sai daqui alimenta a media e a decisao do orquestrador.
  modelo-de-raciocinio: ${MODELO_DE_RACIOCINIO:claude-sonnet-5}
  # Gerador: separado para poder baixar so ele de nivel sem mexer na correcao.
  modelo-de-geracao: ${MODELO_DE_GERACAO:claude-sonnet-5}
  # Avaliador: separado do modelo de raciocinio para poder trocar so a correcao sem
  # mexer no nivelamento nem na geracao de conteudo, que compartilham aquele.
  # Vazio herda o de raciocinio.
  modelo-de-avaliacao: ${MODELO_DE_AVALIACAO:}
  modelo-simples: claude-haiku-4-5
  # Desafios pedidos por chamada. O custo fixo do pedido e dividido por este numero.
  desafios-por-lote: ${DESAFIOS_POR_LOTE:5}
  # Lote da primeira visita a um modulo: quem nunca praticou ali pode nao voltar,
  # e o lote cheio deixaria quatro desafios ja pagos parados na fila.
  desafios-por-lote-inicial: ${DESAFIOS_POR_LOTE_INICIAL:2}

  # Raciocinio estendido na avaliacao. Nao aparece na resposta, mas e cobrado como
  # saida — o item mais caro da chamada. Desligar economiza cerca de um terco do custo
  # total do app; a troca e qualidade da correcao por dinheiro.
  raciocinio-na-avaliacao: ${RACIOCINIO_NA_AVALIACAO:true}

  # Endereco publico do app. Entra no link do e-mail de recuperacao, entao precisa ser
  # o que o navegador do aluno alcanca — nao o endereco interno do container.
  url-base: ${URL_BASE:http://localhost:5173}
  email:
    # De quem o e-mail sai. No Gmail, precisa ser a mesma conta da senha de app.
    remetente: ${EMAIL_REMETENTE:}
  # Dolar por milhao de tokens. Confira em anthropic.com/pricing: modelo sem preco
  # aqui tem os tokens gravados e o custo marcado como desconhecido, nunca como zero.
  precos-por-milhao-de-tokens:
    claude-sonnet-5:
      entrada: 3.00
      saida: 15.00
    claude-opus-5:
      entrada: 5.00
      saida: 25.00
    claude-haiku-4-5:
      entrada: 1.00
      saida: 5.00
  seguranca:
    tentativas-ate-bloquear: ${TENTATIVAS_ATE_BLOQUEAR:5}
    minutos-de-bloqueio: ${MINUTOS_DE_BLOQUEIO:15}
    tamanho-minimo-da-senha: 10
    minutos-de-sessao: ${MINUTOS_DE_SESSAO:60}
    origens-permitidas: ${ORIGENS_PERMITIDAS:http://localhost:5173,http://127.0.0.1:5173}
    # Endereco publico com chave de API paga atras: sem teto, criar contas em massa
    # sai de graca para quem cria e caro para quem paga.
    cadastros-por-origem-por-hora: ${CADASTROS_POR_ORIGEM_POR_HORA:3}
    recusas-por-origem-por-hora: ${RECUSAS_POR_ORIGEM_POR_HORA:30}
    # Janela em que um e-mail interceptado ainda serve para entrar na conta.
    minutos-do-link-de-recuperacao: ${MINUTOS_DO_LINK:15}
    # Sem teto, o endpoint vira maquina de mandar e-mail para endereco alheio.
    recuperacoes-por-origem-por-hora: ${RECUPERACOES_POR_ORIGEM_POR_HORA:5}

server:
  # PORT antes de PORTA: as plataformas de hospedagem (Render, Cloud Run) escolhem a
  # porta e a injetam como PORT, sem perguntar. Um app que ignora essa variavel escuta
  # na porta errada, nao recebe nada, e a plataforma o derruba por "nao respondeu" —
  # sem nenhum erro que aponte para a porta.
  port: ${PORT:${PORTA:8080}}
  # Atras de proxy reverso, a requisicao chega ao Spring como HTTP puro mesmo tendo
  # sido HTTPS ate o proxy. Sem ler os cabecalhos encaminhados, o Spring recusa o
  # cookie `secure` que ele mesmo pediu e ninguem consegue entrar.
  #
  # Fica desligado por padrao de proposito: aceitar X-Forwarded-* de qualquer origem
  # e confiar num cabecalho que o cliente pode escrever. So ligue quando houver um
  # proxy de verdade na frente, e um que sobrescreva esses cabecalhos.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  servlet:
    session:
      # Expira por inatividade: sessao eterna e credencial eterna.
      timeout: ${MINUTOS_DE_SESSAO:60}m
      cookie:
        # Fora do alcance de JavaScript: uma falha de XSS nao rouba a sessao.
        http-only: true
        # O navegador nao envia o cookie em requisicao vinda de outro site.
        same-site: strict
        # Em producao com HTTPS isto e obrigatorio. Falso no local porque
        # o navegador descarta cookie "secure" servido por http://localhost.
        secure: ${COOKIE_SEGURO:false}
        name: SESSAO

# Superficie minima: so a sonda de vida, e sem detalhe interno.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # O app nao depende de e-mail para funcionar, e a sonda de vida nao pode achar que
    # depende. Ligado, este indicador conecta no SMTP a cada consulta: sem SMTP
    # configurado ele falha sempre, e com SMTP configurado ele falha em qualquer
    # instabilidade do provedor. Nos dois casos /actuator/health devolve 503 e o
    # orquestrador mata um app que estava perfeitamente saudavel — derrubando o
    # aprendizado de todo mundo por causa de um recurso que quase ninguem usa.
    #
    # Falha de envio continua aparecendo, como ERROR no log, que e o lugar certo.
    mail:
      enabled: false
  info:
    env:
      enabled: false

logging:
  level:
    br.com.agenteingles: DEBUG

