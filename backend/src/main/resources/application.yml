spring:
  application:
    name: agente-ingles
  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5432/agente_ingles}
    username: ${BANCO_USUARIO:agente}
    password: ${BANCO_SENHA:agente}
  jpa:
    open-in-view: false
    hibernate:
      # O schema e controlado pelo Flyway; o Hibernate apenas valida se bate com as entidades.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    anthropic:
      # A chave nunca fica no repositorio: vem da variavel de ambiente ANTHROPIC_API_KEY.
      api-key: ${ANTHROPIC_API_KEY:}

agente-ingles:
  # Enquanto false, os agentes usam a implementacao simulada e nao consomem a API.
  usar-claude: ${USAR_CLAUDE:false}
  modelo-de-raciocinio: claude-sonnet-5
  modelo-simples: claude-haiku-4-5
  # Identidade do usuario de desenvolvimento ate a autenticacao entrar.
  email-do-usuario-padrao: dev@agenteingles.local

server:
  port: ${PORTA:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    br.com.agenteingles: DEBUG
