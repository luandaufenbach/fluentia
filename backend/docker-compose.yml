services:
  banco:
    image: postgres:16-alpine
    container_name: agente-ingles-banco
    environment:
      POSTGRES_DB: agente_ingles
      POSTGRES_USER: agente
      POSTGRES_PASSWORD: agente
      # Mesmo fuso da aplicacao. As colunas sao TIMESTAMP sem fuso, entao banco em UTC
      # e aplicacao em outro fuso fazem o DEFAULT NOW() gravar 3 horas a frente do que
      # o Java grava na linha ao lado — e perto da meia-noite isso muda o dia.
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      PGTZ: ${FUSO_HORARIO:-America/Sao_Paulo}
    ports:
      - "5432:5432"
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
      - ./docker/criar-banco-de-teste.sql:/docker-entrypoint-initdb.d/10-criar-banco-de-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente -d agente_ingles"]
      interval: 5s
      timeout: 3s
      retries: 10

  aplicacao:
    build: .
    container_name: agente-ingles-aplicacao
    depends_on:
      banco:
        condition: service_healthy
    environment:
      BANCO_URL: jdbc:postgresql://banco:5432/agente_ingles
      BANCO_USUARIO: agente
      BANCO_SENHA: agente
      # O container nasce em UTC. Sem isto, quem estuda as 22h no Brasil tem a pratica
      # gravada como do dia seguinte, e a sequencia de dias quebra sozinha.
      # Limite conhecido: uma zona para todos. Publico fora deste fuso pede zona por conta.
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      # Deixe USAR_CLAUDE=true e informe a chave para ligar os agentes reais.
      USAR_CLAUDE: ${USAR_CLAUDE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    profiles:
      - completo

volumes:
  dados-do-banco:
